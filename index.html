<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Agendamiento de Citas Médicas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="style.css" />
    
    <script defer src="app.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4 text-center">Agendamiento de Citas Médicas</h1>
        
        <section id="form-section" class="mb-5">
            <form id="cita-form" class="row g-3">
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre del Paciente</label>
                    <input type="text" class="form-control" id="nombre" required />
                </div>
                <div class="col-md-6">
                    <label for="documento" class="form-label">Documento de Identidad</label>
                    <input type="number" class="form-control" id="documento" required />
                </div>
                <div class="col-md-4">
                    <label for="medico" class="form-label">Médico / Especialidad</label>
                    <select class="form-select" id="medico" required>
                        <option value="" disabled selected>Seleccione</option>
                        <option>General</option>
                        <option>Pediatría</option>
                        <option>Odontología</option>
                        <option>Cardiología</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="fecha" class="form-label">Fecha de la Cita</label>
                    <input type="date" class="form-control" id="fecha" required />
                </div>
                <div class="col-md-4">
                    <label for="hora" class="form-label">Hora de la Cita</label>
                    <input type="time" class="form-control" id="hora" min="07:00" max="18:00" required />
                </div>
                <div class="col-12">
                    <label for="motivo" class="form-label">Motivo de la Consulta</label>
                    <textarea class="form-control" id="motivo" rows="2" required></textarea>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary" id="submit-btn">Guardar Cita</button>
                </div>
            </form>
        </section>

        <section id="list-section">
            <div class="row mb-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="search-input" placeholder="Buscar por nombre o documento..." />
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover" id="citas-table">
                    <thead class="table-light">
                        <tr>
                            <th>Paciente</th>
                            <th>Documento</th>
                            <th>Médico</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">¿Está seguro de que desea eliminar la cita de <span id="delete-paciente"></span>?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
